{% extends "base.html" %}
{% load static %}

{% block title %}Register{% endblock %}

{% block content %}

<div class="max-w-md mx-auto bg-gray-800 p-8 rounded-xl shadow-xl mt-16">

    <h2 class="text-3xl font-bold text-center mb-6 text-cyan-300">Create an Account</h2>

    <form method="post" action="/register/" class="space-y-6">
        {% csrf_token %}

        <div>
            <label for="username" class="block mb-2 font-semibold">Username</label>
            <input type="text" id="username" name="username" required
                   class="w-full p-3 rounded-lg bg-black/30 border border-white/20 focus:ring-2 focus:ring-cyan-400">
        </div>

        <div>
            <label for="password" class="block mb-2 font-semibold">Password</label>
            <input type="password" id="password" name="password" required
                   class="w-full p-3 rounded-lg bg-black/30 border border-white/20 focus:ring-2 focus:ring-cyan-400">
        </div>

        <button type="submit"
                class="w-full py-3 bg-blue-600 hover:bg-blue-700 rounded-lg font-bold shadow">
            Register
        </button>
    </form>

    <p class="text-center mt-6 text-gray-300">
        Already have an account?
        <a href="{% url 'login' %}" class="text-cyan-300 hover:underline">Login</a>
    </p>

</div>

{% endblock %}
