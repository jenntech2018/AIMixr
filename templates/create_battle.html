{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto py-16 px-4">
    <div class="glass-card p-10 border-t-4 border-t-cyan-500 shadow-2xl">
        
        <div class="text-center mb-10">
            <h1 class="text-3xl font-black text-white italic tracking-tighter uppercase">Challenge {{ opponent.username }}</h1>
            <p class="text-gray-400 mt-2">Select your best production to enter the arena.</p>
        </div>

        <form method="POST" class="space-y-8">
            {% csrf_token %}

            <div class="space-y-3">
                <label class="text-[10px] font-black text-gray-500 uppercase tracking-widest ml-1">Your Weapon (Track)</label>
                <div class="relative">
                    <select name="track_id" required 
                        class="w-full bg-white/5 border border-white/10 rounded-xl p-4 text-white appearance-none focus:border-cyan-500 outline-none transition cursor-pointer">
                        <option value="" disabled selected>Choose a track...</option>
                        {% for track in my_tracks %}
                            <option value="{{ track.id }}">{{ track }}</option>
                        {% empty %}
                            <option disabled>No tracks found. Upload one to the dashboard first!</option>
                        {% endfor %}
                    </select>
                    <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-gray-500">
                        ▼
                    </div>
                </div>
            </div>

            <div class="flex flex-col gap-3 pt-4">
                <button type="submit" 
                    class="w-full py-4 bg-cyan-500 hover:bg-cyan-400 text-black font-black rounded-xl transition transform hover:scale-[1.02] active:scale-95 uppercase italic">
                    🔥 Start Battle
                </button>
                
                <a href="{% url 'dashboard' %}" 
                    class="w-full py-4 bg-white/5 hover:bg-white/10 text-gray-400 font-bold rounded-xl transition text-center text-xs uppercase tracking-widest">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
