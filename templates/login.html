<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Login | AIMixr</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        body {
            background: radial-gradient(circle at 50% 0%, #1a1f35 0%, #05070a 100%);
            color: #e2e8f0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 2rem;
        }

        .input-field {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            border-color: #22d3ee;
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.1);
            outline: none;
        }
    </style>
</head>
<body class="px-4">

    <div class="w-full max-w-md animate-in fade-in zoom-in duration-700">
        
        <div class="text-center mb-10">
            <h1 class="text-5xl font-black tracking-tighter bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent inline-block">
                AIMIXR
            </h1>
            <p class="text-gray-500 font-medium text-sm mt-2 uppercase tracking-widest">Neural Audio Mastering</p>
        </div>

        <div class="glass-card p-10 shadow-2xl">
            <h2 class="text-2xl font-bold text-white mb-8">Welcome back</h2>

            <form method="post" action="/login/" class="space-y-6">
                {% csrf_token %}
                
                <div class="space-y-1">
                    <label for="username" class="text-[10px] font-black text-gray-500 uppercase tracking-widest ml-1">Username</label>
                    <input type="text" id="username" name="username" required
                           class="input-field w-full px-5 py-4 rounded-xl text-sm" 
                           placeholder="Enter your username">
                </div>

                <div class="space-y-1">
                    <label for="password" class="text-[10px] font-black text-gray-500 uppercase tracking-widest ml-1">Password</label>
                    <input type="password" id="password" name="password" required
                           class="input-field w-full px-5 py-4 rounded-xl text-sm" 
                           placeholder="••••••••">
                </div>

                <button type="submit" 
                        class="w-full py-4 mt-4 bg-white text-black font-black rounded-xl hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 shadow-xl">
                    SIGN IN
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-white/5 text-center">
                <p class="text-gray-500 text-sm">
                    New to the studio? 
                    <a href="/register/" class="text-cyan-400 font-bold hover:underline ml-1">Create Account</a>
                </p>
            </div>
        </div>

        <p class="text-center text-gray-600 text-[10px] mt-10 uppercase tracking-widest">
            &copy; 2026 AIMixr Laboratory. All rights reserved.
        </p>
    </div>

</body>
</html>
